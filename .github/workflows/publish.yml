name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.2.3 or v1.2.3) - for manual runs"
        required: true
        type: string

# Serialize runs so two rapid tag pushes cannot race on publish.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted Publishing (OIDC): lets `npm publish` authenticate with a
      # short-lived token minted from this workflow's identity instead of a
      # long-lived NPM_TOKEN secret. The npm side must have Trusted Publishing
      # enabled for this package (configured at package settings).
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          # IMPORTANT: do NOT set registry-url here. setup-node would write a
          # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` line into
          # .npmrc which expands to an empty value when NODE_AUTH_TOKEN is
          # unset (the expected state for Trusted Publishing). npm then sees
          # "auth configured" in .npmrc and never starts the OIDC exchange,
          # failing with ENEEDAUTH (see npm/documentation#1960). Node 24 also
          # guarantees npm >= 11.5.1 which Trusted Publishing requires.

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # Version comes from the git tag (refs/tags/v1.2.3 -> 1.2.3). For a
      # manual workflow_dispatch run, use the user-provided version instead.
      - name: Resolve release version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The tag must already be in sync with the code: the release flow is
      # `node scripts/check-version.mjs vX.Y.Z` then `git tag vX.Y.Z`, so the
      # checked-out src/version.ts / package.json / README.md all report the tag
      # version. This step is a guard for tags created without that check.
      - name: Verify version matches tag
        run: node scripts/check-version.mjs "${{ steps.version.outputs.version }}"

      # Build the single-file artifact (src/ -> root monitor.ts, with a
      # PLUGIN_VERSION literal assertion inside scripts/build.mjs). npm publish
      # packs exactly this freshly-built monitor.ts (see package.json files).
      - name: Build plugin bundle
        run: node scripts/build.mjs

      # Trusted Publishing: no secrets, no config set. npm fetches an OIDC
      # token from the workflow's id-token permission and exchanges it for a
      # temporary npm token. --provenance attaches build provenance to the
      # published attestations. The strip step below guards against a leftover
      # empty _authToken line that would short-circuit the OIDC flow.
      - name: Publish to npm
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then
            sed -i '/_authToken/d' "$npmrc"
          fi
          npm publish --provenance --access public