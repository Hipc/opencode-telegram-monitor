name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.2.3 or v1.2.3) - for manual runs"
        required: true
        type: string

# Serialize runs so two rapid tag pushes cannot race on set-version/commit.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Trusted Publishing (OIDC): lets `npm publish` authenticate with a
      # short-lived token minted from this workflow's identity instead of a
      # long-lived NPM_TOKEN secret. The npm side must have Trusted Publishing
      # enabled for this package (configured at package settings).
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # Version comes from the git tag (refs/tags/v1.2.3 -> 1.2.3). For a
      # manual workflow_dispatch run, use the user-provided version instead.
      - name: Resolve release version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Replace the version everywhere (monitor.ts / package.json / README.md)
      # with the tag version so the published tarball is self-consistent.
      - name: Set version strings
        run: node scripts/set-version.mjs "${{ steps.version.outputs.version }}"

      - name: Verify replaced version
        run: |
          grep -q "const PLUGIN_VERSION = \"${{ steps.version.outputs.version }}\";" monitor.ts
          echo "monitor.ts reports ${{ steps.version.outputs.version }}"

      - name: Check plugin compiles
        run: bun build --no-bundle --target node --external "*" monitor.ts

      - name: Commit version bump back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitor.ts package.json README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(monitor): set version ${{ steps.version.outputs.version }} [skip ci]"
            git push origin HEAD:main
          else
            echo "no version changes to commit"
          fi

      # Trusted Publishing: no secrets, no config set. npm fetches an OIDC
      # token from the workflow's id-token permission and exchanges it for a
      # temporary npm token. --provenance attaches build provenance to the
      # published attestations.
      - name: Publish to npm
        run: npm publish --provenance --access public